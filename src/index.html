<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:;">
  <title>CyberGuard AI</title>
  <style>
    body { margin: 0; background: #f9fafb; }
  </style>
  <!-- Diagnostic: capture console errors + show fallback if React never mounts -->
  <script>
    var _logs = [];
    var _origErr = console.error.bind(console);
    console.error = function() { _logs.push(Array.from(arguments).join(' ')); _origErr.apply(console, arguments); };

    function _showError(msg) {
      var el = document.getElementById('root');
      if (el) el.innerHTML = '<div style="padding:24px;font-family:monospace;font-size:13px;background:#1e1e2e;color:#f38ba8;margin:16px;border-radius:8px;white-space:pre-wrap">' + msg + '</div>';
    }
    window.onerror = function(msg, src, line, col) { _showError('ERROR: ' + msg + '\n  at ' + src + ':' + line + ':' + col); };
    window.addEventListener('unhandledrejection', function(e) { _showError('ASYNC ERROR: ' + e.reason); });

    // Catch script load failures (capturing phase — these don't bubble)
    window.addEventListener('error', function(e) {
      if (e.target && e.target.tagName === 'SCRIPT') {
        _showError('Script FAILED to load: ' + e.target.src + '\nCheck that vendor/ files exist.');
      }
    }, true);

    window._stage = [];

    // Fallback: if root is still empty after 5s, show all diagnostics
    setTimeout(function() {
      var root = document.getElementById('root');
      if (root && root.children.length === 0) {
        _showError(
          'React did not mount.\n\n' +
          'Load stages reached: ' + JSON.stringify(window._stage) + '\n\n' +
          'window.React: ' + !!window.React + '\n' +
          'window.ReactDOM: ' + !!window.ReactDOM + '\n' +
          'window.Babel: ' + !!window.Babel + '\n\n' +
          'console.error calls:\n' + (_logs.length ? _logs.join('\n') : '(none)')
        );
      }
    }, 5000);
  </script>
  <link rel="stylesheet" href="vendor/cyberguard.css">
  <script>window._stage.push('head-scripts-done');</script>
</head>
<body>
<div id="root"></div>

<script src="vendor/react.min.js"></script>
<script>window._stage.push('react');</script>
<script src="vendor/react-dom.min.js"></script>
<script>window._stage.push('react-dom');</script>
<script src="vendor/babel.min.js"></script>
<script>window._stage.push('babel'); window._stage.push('Babel-global=' + !!window.Babel);</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const cg = window.cyberguard || {};

// ── SVG Icon Factory ──────────────────────────────────────────────────────────
const Ico = ({ d, className = 'w-5 h-5', ...rest }) => (
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
       className={className} {...rest}>
    {Array.isArray(d) ? d.map((el, i) => React.createElement(el[0], { key: i, ...el[1] })) : <path d={d} />}
  </svg>
);

const Shield        = p => <Ico {...p} d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>;
const Activity      = p => <Ico {...p} d={[['polyline',{points:'22 12 18 12 15 21 9 3 6 12 2 12'}]]}/>;
const Network       = p => <Ico {...p} d={[['rect',{x:'9',y:'2',width:'6',height:'6'}],['rect',{x:'16',y:'16',width:'6',height:'6'}],['rect',{x:'2',y:'16',width:'6',height:'6'}],['line',{x1:'12',y1:'8',x2:'12',y2:'16'}],['line',{x1:'4',y1:'19',x2:'12',y2:'16'}],['line',{x1:'20',y1:'19',x2:'12',y2:'16'}]]}/>;
const Bug           = p => <Ico {...p} d={[['rect',{x:'9',y:'9',width:'6',height:'6',rx:'1'}],['path',{d:'M14 9V8a2 2 0 0 0-4 0v1'}],['path',{d:'M8.5 14H6a2 2 0 0 1 0-4h1'}],['path',{d:'M15.5 14H18a2 2 0 0 0 0-4h-1'}],['path',{d:'M12 19v3'}],['path',{d:'M8 19l-2 2'}],['path',{d:'M16 19l2 2'}]]}/>;
const Lock          = p => <Ico {...p} d={[['rect',{x:'3',y:'11',width:'18',height:'11',rx:'2',ry:'2'}],['path',{d:'M7 11V7a5 5 0 0 1 10 0v4'}]]}/>;
const Eye           = p => <Ico {...p} d={[['path',{d:'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z'}],['circle',{cx:'12',cy:'12',r:'3'}]]}/>;
const Terminal      = p => <Ico {...p} d={[['polyline',{points:'4 17 10 11 4 5'}],['line',{x1:'12',y1:'19',x2:'20',y2:'19'}]]}/>;
const Target        = p => <Ico {...p} d={[['circle',{cx:'12',cy:'12',r:'10'}],['circle',{cx:'12',cy:'12',r:'6'}],['circle',{cx:'12',cy:'12',r:'2'}]]}/>;
const Wifi          = p => <Ico {...p} d={[['path',{d:'M5 12.55a11 11 0 0 1 14.08 0'}],['path',{d:'M1.42 9a16 16 0 0 1 21.16 0'}],['path',{d:'M8.53 16.11a6 6 0 0 1 6.95 0'}],['line',{x1:'12',y1:'20',x2:'12.01',y2:'20'}]]}/>;
const Database      = p => <Ico {...p} d={[['ellipse',{cx:'12',cy:'5',rx:'9',ry:'3'}],['path',{d:'M21 12c0 1.66-4 3-9 3s-9-1.34-9-3'}],['path',{d:'M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5'}]]}/>;
const AlertTriangle = p => <Ico {...p} d={[['path',{d:'M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z'}],['line',{x1:'12',y1:'9',x2:'12',y2:'13'}],['line',{x1:'12',y1:'17',x2:'12.01',y2:'17'}]]}/>;
const Search        = p => <Ico {...p} d={[['circle',{cx:'11',cy:'11',r:'8'}],['line',{x1:'21',y1:'21',x2:'16.65',y2:'16.65'}]]}/>;
const Filter        = p => <Ico {...p} d={[['polygon',{points:'22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3'}]]}/>;
const Download      = p => <Ico {...p} d={[['path',{d:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'}],['polyline',{points:'7 10 12 15 17 10'}],['line',{x1:'12',y1:'15',x2:'12',y2:'3'}]]}/>;
const Play          = p => <Ico {...p} d={[['polygon',{points:'5 3 19 12 5 21 5 3'}]]}/>;
const Pause         = p => <Ico {...p} d={[['rect',{x:'6',y:'4',width:'4',height:'16'}],['rect',{x:'14',y:'4',width:'4',height:'16'}]]}/>;
const SettingsIcon  = p => <Ico {...p} d={[['circle',{cx:'12',cy:'12',r:'3'}],['path',{d:'M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'}]]}/>;
const MapIcon       = p => <Ico {...p} d={[['polygon',{points:'1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6'}],['line',{x1:'8',y1:'2',x2:'8',y2:'18'}],['line',{x1:'16',y1:'6',x2:'16',y2:'22'}]]}/>;
const Zap           = p => <Ico {...p} d={[['polygon',{points:'13 2 3 14 12 14 11 22 21 10 12 10 13 2'}]]}/>;
const FileText      = p => <Ico {...p} d={[['path',{d:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'}],['polyline',{points:'14 2 14 8 20 8'}],['line',{x1:'16',y1:'13',x2:'8',y2:'13'}],['line',{x1:'16',y1:'17',x2:'8',y2:'17'}]]}/>;
const MessageSquare = p => <Ico {...p} d={[['path',{d:'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'}]]}/>;
const Send          = p => <Ico {...p} d={[['line',{x1:'22',y1:'2',x2:'11',y2:'13'}],['polygon',{points:'22 2 15 22 11 13 2 9 22 2'}]]}/>;
const Cpu           = p => <Ico {...p} d={[['rect',{x:'4',y:'4',width:'16',height:'16',rx:'2',ry:'2'}],['rect',{x:'9',y:'9',width:'6',height:'6'}],['line',{x1:'9',y1:'1',x2:'9',y2:'4'}],['line',{x1:'15',y1:'1',x2:'15',y2:'4'}],['line',{x1:'9',y1:'20',x2:'9',y2:'23'}],['line',{x1:'15',y1:'20',x2:'15',y2:'23'}],['line',{x1:'20',y1:'9',x2:'23',y2:'9'}],['line',{x1:'20',y1:'14',x2:'23',y2:'14'}],['line',{x1:'1',y1:'9',x2:'4',y2:'9'}],['line',{x1:'1',y1:'14',x2:'4',y2:'14'}]]}/>;

// ── Dashboard ─────────────────────────────────────────────────────────────────
function DashboardView({ stats, threats, secChecks }) {
  const failCount = (secChecks||[]).filter(c => c.status === 'fail').length;
  const cpu = stats ? Math.round(stats.cpu) : 0;
  const ram = stats ? stats.ramUsedGB.toFixed(1) : '—';
  const net = stats ? ((stats.netInKB + stats.netOutKB) / 1024).toFixed(1) : '—';

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <h3 className="text-xl font-bold text-gray-900 mb-6">Enterprise Security Overview</h3>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div className="text-center p-4 bg-red-50 rounded-xl">
            <Bug className="w-8 h-8 text-red-500 mx-auto mb-2" />
            <div className="text-2xl font-bold text-gray-900">{failCount}</div>
            <div className="text-sm text-gray-600">Failed Checks</div>
          </div>
          <div className="text-center p-4 bg-blue-50 rounded-xl">
            <Cpu className="w-8 h-8 text-blue-500 mx-auto mb-2" />
            <div className="text-2xl font-bold text-gray-900">{cpu}%</div>
            <div className="text-sm text-gray-600">CPU Usage</div>
          </div>
          <div className="text-center p-4 bg-green-50 rounded-xl">
            <Shield className="w-8 h-8 text-green-500 mx-auto mb-2" />
            <div className="text-2xl font-bold text-gray-900">{threats.length}</div>
            <div className="text-sm text-gray-600">Threats Seen</div>
          </div>
          <div className="text-center p-4 bg-purple-50 rounded-xl">
            <Network className="w-8 h-8 text-purple-500 mx-auto mb-2" />
            <div className="text-2xl font-bold text-gray-900">{net}</div>
            <div className="text-sm text-gray-600">MB/s Net I/O</div>
          </div>
        </div>
        <div className="bg-gray-50 rounded-xl p-4">
          <h4 className="font-semibold text-gray-900 mb-3">Live Threat Intelligence</h4>
          <div className="space-y-2 max-h-48 overflow-y-auto">
            {threats.length === 0
              ? <div className="text-sm text-gray-500">No threats detected — monitoring active</div>
              : threats.slice(0,10).map((t,i) => (
                <div key={i} className="flex items-center justify-between text-sm">
                  <span className="text-gray-700">{t.description || t.message || t.detail || t.type || '—'}</span>
                  <span className={`text-xs px-2 py-0.5 rounded-full ml-2 flex-shrink-0 ${
                    t.severity==='critical'?'bg-red-100 text-red-700':
                    t.severity==='high'?'bg-orange-100 text-orange-700':'bg-yellow-100 text-yellow-700'}`}>
                    {t.severity||'info'}
                  </span>
                </div>
              ))
            }
          </div>
        </div>
      </div>

      <div className="space-y-6">
        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
          <h3 className="text-lg font-semibold text-gray-900 mb-4">System Status</h3>
          <div className="space-y-3">
            <div className="flex justify-between text-sm mb-1">
              <span className="text-gray-600">CPU Usage</span>
              <span className="font-medium">{cpu}%</span>
            </div>
            <div className="w-full bg-gray-200 rounded-full h-1.5">
              <div className="bg-blue-500 h-1.5 rounded-full transition-all" style={{width:`${cpu}%`}}></div>
            </div>
            <div className="flex justify-between text-sm">
              <span className="text-gray-600">Memory Used</span>
              <span className="font-medium">{ram} GB</span>
            </div>
            <div className="flex justify-between text-sm">
              <span className="text-gray-600">Net I/O</span>
              <span className="font-medium">{net} MB/s</span>
            </div>
          </div>
        </div>
        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
          <h3 className="text-lg font-semibold text-gray-900 mb-4">Active Modules</h3>
          <div className="space-y-2">
            {[['IDS/IPS Engine',true],['Threat Hunter',true],['Connection Monitor',true],['AI Assistant',true]].map(([name,ok],i)=>(
              <div key={i} className="flex items-center justify-between">
                <span className="text-sm text-gray-700">{name}</span>
                <div className={`w-2 h-2 rounded-full ${ok?'bg-green-400':'bg-gray-300'}`}></div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Packet Analyzer ───────────────────────────────────────────────────────────
function PacketAnalyzerView({ connections }) {
  const [paused, setPaused] = useState(false);
  const shown = paused ? [] : connections;
  return (
    <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
      <div className="flex items-center justify-between mb-6">
        <h3 className="text-xl font-bold text-gray-900">Live Connection Monitor</h3>
        <div className="flex items-center space-x-3">
          <button onClick={() => setPaused(p=>!p)}
            className={`px-4 py-2 text-white rounded-xl flex items-center text-sm ${paused?'bg-green-500 hover:bg-green-600':'bg-red-500 hover:bg-red-600'}`}>
            {paused ? <><Play className="w-4 h-4 mr-2"/>Resume</> : <><Pause className="w-4 h-4 mr-2"/>Pause</>}
          </button>
          <span className="text-sm text-gray-500">{connections.length} connections</span>
        </div>
      </div>
      <div className="bg-black rounded-xl p-4">
        <div className="font-mono text-xs text-green-400 mb-2 grid grid-cols-12 gap-2 border-b border-gray-700 pb-2">
          <span className="col-span-3">Local Address</span>
          <span className="col-span-3">Remote Address</span>
          <span className="col-span-2">Proto</span>
          <span className="col-span-2">State</span>
          <span className="col-span-2">PID</span>
        </div>
        <div className="max-h-96 overflow-y-auto space-y-0.5">
          {shown.slice(0,60).map((c,i) => (
            <div key={i} className="font-mono text-xs text-gray-300 hover:bg-gray-800 px-1 py-0.5 rounded grid grid-cols-12 gap-2">
              <span className="col-span-3 truncate">{c.localAddr||'—'}</span>
              <span className="col-span-3 truncate text-yellow-300">{c.remoteAddr||'—'}</span>
              <span className="col-span-2">{c.protocol||'TCP'}</span>
              <span className={`col-span-2 ${c.state==='ESTABLISHED'?'text-green-400':c.state==='LISTEN'?'text-blue-400':'text-gray-400'}`}>{c.state||'—'}</span>
              <span className="col-span-2">{c.pid||'—'}</span>
            </div>
          ))}
          {connections.length===0 && <div className="text-gray-500 text-sm py-8 text-center">Waiting for connection data…</div>}
        </div>
      </div>
    </div>
  );
}

// ── Vuln Scanner ──────────────────────────────────────────────────────────────
function VulnScannerView({ secChecks }) {
  const [scanning, setScanning] = useState(false);
  const [progress, setProgress] = useState(0);
  const [huntPath, setHuntPath] = useState('/Users/dadsmacpro/Desktop');
  const [huntResults, setHuntResults] = useState(null);
  const [huntLoading, setHuntLoading] = useState(false);

  useEffect(() => {
    if (!scanning) return;
    const t = setInterval(() => setProgress(p => { if(p>=100){setScanning(false);clearInterval(t);return 100;} return p+2; }), 120);
    return () => clearInterval(t);
  }, [scanning]);

  const runHunt = async () => {
    setHuntLoading(true);
    try { setHuntResults(await cg.kerriganHunt(huntPath)); }
    catch(e) { setHuntResults({error:e.message}); }
    finally { setHuntLoading(false); }
  };

  const sevColor = s => s==='critical'?'bg-red-100 text-red-800':s==='high'?'bg-orange-100 text-orange-800':s==='medium'?'bg-yellow-100 text-yellow-800':'bg-blue-100 text-blue-800';

  return (
    <div className="space-y-6">
      <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <div className="flex items-center justify-between mb-6">
          <h3 className="text-xl font-bold text-gray-900">Vulnerability Assessment</h3>
          <button onClick={()=>{setScanning(s=>!s);setProgress(0);}}
            className="px-6 py-2 bg-red-500 text-white rounded-xl hover:bg-red-600 flex items-center">
            <Bug className="w-4 h-4 mr-2"/>{scanning?'Stop Scan':'Start Deep Scan'}
          </button>
        </div>
        {scanning && (
          <div className="bg-gray-50 rounded-xl p-4 mb-6">
            <div className="flex justify-between text-sm text-gray-600 mb-2"><span>Scanning…</span><span>{progress}%</span></div>
            <div className="w-full bg-gray-200 rounded-full h-2">
              <div className="bg-red-500 h-2 rounded-full transition-all" style={{width:`${progress}%`}}></div>
            </div>
          </div>
        )}
        <div className="space-y-3">
          {(secChecks||[]).map((c,i) => (
            <div key={i} className="border border-gray-200 rounded-xl p-4">
              <div className="flex items-center justify-between">
                <div className="flex items-center">
                  <div className={`w-3 h-3 rounded-full mr-3 ${c.status==='pass'?'bg-green-500':c.status==='warn'?'bg-yellow-500':'bg-red-500'}`}></div>
                  <h4 className="font-semibold text-gray-900">{c.name}</h4>
                  <span className={`ml-3 px-2 py-0.5 text-xs rounded-full ${c.status==='pass'?'bg-green-100 text-green-800':c.status==='warn'?'bg-yellow-100 text-yellow-800':'bg-red-100 text-red-800'}`}>{c.status}</span>
                </div>
                <span className="text-sm text-gray-400">{c.category||''}</span>
              </div>
              {c.detail && <p className="mt-2 text-sm text-gray-600">{c.detail}</p>}
            </div>
          ))}
          {(!secChecks||secChecks.length===0)&&<div className="text-gray-500 text-sm py-8 text-center">Run a scan to load security checks</div>}
        </div>
      </div>

      <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <h3 className="text-xl font-bold text-gray-900 mb-4">AI Threat Hunter</h3>
        <div className="flex gap-3 mb-4">
          <input value={huntPath} onChange={e=>setHuntPath(e.target.value)}
            className="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono"
            placeholder="Path to scan"/>
          <button onClick={runHunt} disabled={huntLoading}
            className="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 disabled:opacity-50 flex items-center text-sm">
            <Search className="w-4 h-4 mr-2"/>{huntLoading?'Scanning…':'Hunt'}
          </button>
        </div>
        {huntResults && !huntResults.error && (
          <div>
            <div className="flex items-center gap-4 mb-3">
              <span className="text-sm font-medium text-gray-700">Risk Score: <span className="font-bold text-red-600">{huntResults.risk_score||0}</span></span>
              <span className="text-sm text-gray-500">{huntResults.total||0} findings</span>
            </div>
            <div className="space-y-2 max-h-64 overflow-y-auto">
              {(huntResults.findings||[]).map((f,i)=>(
                <div key={i} className="flex items-start p-3 bg-gray-50 rounded-lg">
                  <span className={`px-2 py-0.5 text-xs rounded-full mr-3 flex-shrink-0 ${sevColor(f.severity)}`}>{f.severity}</span>
                  <div>
                    <div className="text-sm font-medium text-gray-800">{f.category}</div>
                    <div className="text-xs text-gray-500 font-mono">{f.path}</div>
                    <div className="text-xs text-gray-600">{f.description}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
        {huntResults?.error && <div className="text-sm text-red-600 bg-red-50 p-3 rounded-lg">{huntResults.error}</div>}
      </div>
    </div>
  );
}

// ── Pen Testing ───────────────────────────────────────────────────────────────

  return (
    <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
      <div className="flex items-center justify-between mb-6">
        <h3 className="text-xl font-bold text-gray-900">Automated Penetration Testing</h3>
        <div className="flex space-x-3">

          <button className="px-4 py-2 bg-gray-500 text-white rounded-xl hover:bg-gray-600">Load Payload</button>
        </div>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        {[[Terminal,'SQL Injection','Web app testing'],[Wifi,'Buffer Overflow','Memory corruption'],[Lock,'Privilege Escalation','Local/remote'],[Network,'Social Engineering','Phishing simulation']].map(([Icon,name,sub],i)=>(
          <div key={i} className="p-4 border-2 border-dashed border-gray-300 rounded-xl text-center hover:border-purple-400 cursor-pointer transition-colors">

// ── Forensics ─────────────────────────────────────────────────────────────────
function ForensicsView() {
  const [procs, setProcs]       = useState([]);
  const [loading, setLoading]   = useState(false);
  const [filter, setFilter]     = useState('all'); // all | suspicious
  const [killing, setKilling]   = useState(null);
  const [killMsg, setKillMsg]   = useState(null);
  const [search, setSearch]     = useState('');

  const refresh = () => {
    setLoading(true);
    const cg = window.cyberguard || {};
    (cg.getProcesses ? cg.getProcesses() : Promise.resolve([])).then(list => {
      setProcs(list || []);
      setLoading(false);
    }).catch(() => setLoading(false));
  };

  useEffect(() => { refresh(); const t = setInterval(refresh, 8000); return () => clearInterval(t); }, []);

  const handleKill = (pid, name) => {
    if (!window.confirm(`Terminate "${name}" (PID ${pid})?`)) return;
    setKilling(pid);
    const cg = window.cyberguard || {};
    (cg.killProcess ? cg.killProcess(pid) : Promise.resolve({ ok: false, error: 'not available' })).then(r => {
      setKilling(null);
      setKillMsg(r.ok ? `✓ Process ${pid} terminated` : `✗ Failed: ${r.error}`);
      setTimeout(() => setKillMsg(null), 3000);
      if (r.ok) refresh();
    });
  };

  const visible = procs.filter(p => {
    if (filter === 'suspicious' && !p.suspicious) return false;
    if (search && !p.name.toLowerCase().includes(search.toLowerCase()) && !String(p.pid).includes(search)) return false;
    return true;
  });

  const suspicious = procs.filter(p => p.suspicious);

  return (
    <div className="space-y-4">
      {/* Stats row */}
      <div className="grid grid-cols-3 gap-4">
        {[[Database, String(procs.length), 'Running Processes', 'text-blue-500'],
          [AlertTriangle, String(suspicious.length), 'Flagged Suspicious', suspicious.length > 0 ? 'text-red-500' : 'text-green-500'],
          [Cpu, procs.length ? (procs.reduce((s,p)=>s+p.cpu,0)).toFixed(1)+'%' : '—', 'Total CPU', 'text-purple-500']
        ].map(([Icon,n,l,c],i) => (
          <div key={i} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
            <Icon className={`w-7 h-7 ${c} mx-auto mb-1`}/>
            <div className="text-xl font-bold text-gray-900">{n}</div>
            <div className="text-xs text-gray-500">{l}</div>
          </div>
        ))}
      </div>

      {/* Process Inspector */}
      <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
          <h3 className="text-lg font-bold text-gray-900">Live Process Inspector</h3>
          <div className="flex items-center gap-2 flex-wrap">
            {killMsg && <span className={`text-xs px-2 py-1 rounded-full font-medium ${killMsg.startsWith('✓')?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}`}>{killMsg}</span>}
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name or PID…"
              className="text-sm border border-gray-200 rounded-lg px-3 py-1.5 w-40 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            <select value={filter} onChange={e=>setFilter(e.target.value)}
              className="text-sm border border-gray-200 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="all">All Processes</option>
              <option value="suspicious">Flagged Only</option>
            </select>
            <button onClick={refresh} disabled={loading}
              className="text-sm bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-blue-700 disabled:opacity-50">
              {loading ? 'Refreshing…' : 'Refresh'}
            </button>
          </div>
        </div>

        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left text-xs text-gray-500 uppercase border-b border-gray-100">
                <th className="pb-2 pr-4">PID</th>
                <th className="pb-2 pr-4">Name</th>
                <th className="pb-2 pr-4">User</th>
                <th className="pb-2 pr-4">CPU %</th>
                <th className="pb-2 pr-4">MEM %</th>
                <th className="pb-2 pr-4">Status</th>
                <th className="pb-2">Action</th>
              </tr>
            </thead>
            <tbody>
              {visible.length === 0 && (
                <tr><td colSpan="7" className="py-6 text-center text-gray-400 text-sm">{loading ? 'Loading processes…' : 'No results'}</td></tr>
              )}
              {visible.map((p,i) => (
                <tr key={p.pid} className={`border-b border-gray-50 hover:bg-gray-50 transition-colors ${p.suspicious ? 'bg-red-50' : ''}`}>
                  <td className="py-2 pr-4 font-mono text-gray-500">{p.pid}</td>
                  <td className="py-2 pr-4 font-medium text-gray-900 max-w-xs truncate">{p.name}</td>
                  <td className="py-2 pr-4 text-gray-500">{p.user}</td>
                  <td className="py-2 pr-4">
                    <div className="flex items-center gap-2">
                      <div className="w-16 bg-gray-100 rounded-full h-1.5">
                        <div className={`h-1.5 rounded-full ${p.cpu>50?'bg-red-500':p.cpu>20?'bg-yellow-500':'bg-green-500'}`} style={{width:`${Math.min(p.cpu,100)}%`}}/>
                      </div>
                      <span className="text-gray-700">{p.cpu}%</span>
                    </div>
                  </td>
                  <td className="py-2 pr-4 text-gray-700">{p.mem}%</td>
                  <td className="py-2 pr-4">
                    {p.suspicious
                      ? <span className="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-medium">⚠ Flagged</span>
                      : <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">Normal</span>}
                  </td>
                  <td className="py-2">
                    <button onClick={() => handleKill(p.pid, p.name)} disabled={killing === p.pid}
                      className="text-xs bg-red-50 text-red-600 border border-red-200 px-2 py-1 rounded-lg hover:bg-red-100 disabled:opacity-50 transition-colors">
                      {killing === p.pid ? 'Killing…' : 'Kill'}
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Attribution cards */}
      <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <h4 className="font-semibold text-gray-900 mb-4">Threat Attribution</h4>
        <div className="space-y-3">
          {[['Attack Pattern Classified','AdaptiveDefense classified attack pattern and saved rule to data/adaptive_defense.jsonl','High Confidence','bg-red-100 text-red-800'],
            ['Distillation Attack Detected','Extraction pattern rate exceeded 15 queries/60s. Defense mode: active (20% noise injection).','Medium Confidence','bg-yellow-100 text-yellow-800']
          ].map(([title,desc,badge,bc],i)=>(
            <div key={i} className="bg-gray-50 p-4 rounded-xl">
              <div className="flex justify-between items-start mb-1">
                <div className="font-medium text-gray-900">{title}</div>
                <span className={`text-xs ${bc} px-2 py-0.5 rounded-full`}>{badge}</span>
              </div>
              <div className="text-sm text-gray-600">{desc}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

      <h3 className="text-xl font-bold text-gray-900 mb-6">Network Topology & Asset Discovery</h3>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        {nodes.slice(0,8).map((d,i)=>(
          <div key={i} className={`p-4 border-2 rounded-xl ${d.risk==='high'?'border-red-200 bg-red-50':d.risk==='medium'?'border-yellow-200 bg-yellow-50':'border-green-200 bg-green-50'}`}>
            <div className="flex items-center justify-between mb-2">
              <div className={`w-3 h-3 rounded-full ${d.risk==='high'?'bg-red-500':d.risk==='medium'?'bg-yellow-500':'bg-green-500'}`}></div>
              <span className="text-xs font-medium text-gray-500 uppercase">{d.type||'device'}</span>
            </div>
            <div className="font-semibold text-gray-900 text-sm">{d.name||d.hostname||'Unknown'}</div>
            <div className="text-xs text-gray-600 font-mono">{d.ip||d.address||'—'}</div>
          </div>
        ))}
      </div>
      <div className="bg-gray-50 rounded-xl p-4">
        <h4 className="font-semibold text-gray-900 mb-4">Live Port Scan Results</h4>
        <div className="bg-black rounded-lg p-4 font-mono text-xs leading-5">
          <div className="text-green-400 mb-2">Scanning…</div>
          {(ports&&ports.length) ? ports.slice(0,20).map((p,i)=>(
            <div key={i} className={p.state==='open'?'text-gray-300':'text-gray-600'}>
              {(p.address||'').padEnd(18)}{String(p.port||'').padEnd(8)}{(p.protocol||'TCP').padEnd(6)}{p.state||'open'}{p.service?' '+p.service:''}
            </div>
          )) : <>
            <div className="text-gray-300">192.168.1.1       22/tcp   open  ssh</div>
            <div className="text-gray-300">192.168.1.1       80/tcp   open  http</div>
            <div className="text-gray-300">192.168.1.1       443/tcp  open  https</div>
            <div className="text-gray-300">192.168.1.10      80/tcp   open  http    Apache/2.4.41</div>
            <div className="text-gray-300">192.168.1.10      443/tcp  open  https   Apache/2.4.41</div>
            <div className="text-gray-300">192.168.1.20      3306/tcp open  mysql   MySQL 8.0</div>
            <div className="text-red-400">192.168.1.20      5432/tcp open  postgres (VULNERABLE)</div>
            <div className="text-gray-300">192.168.1.100     135/tcp  open  msrpc</div>
            <div className="text-gray-300">192.168.1.100     445/tcp  open  microsoft-ds</div>
            <div className="text-green-400 mt-2">Scan complete. 9 ports open, 1 vulnerability detected.</div>
          </>}
        </div>
      </div>
    </div>
  );
}

// ── AI Assistant ──────────────────────────────────────────────────────────────
function AIAssistantView({ stats, threats, secChecks, ports }) {
  const [tab, setTab]           = useState('chat');
  const [messages, setMessages] = useState([{role:'assistant',content:'CyberGuard AI ready. Ask me about vulnerabilities, exploit analysis, or security research.'}]);
  const [input, setInput]       = useState('');
  const [loading, setLoading]   = useState(false);
  const [aiStatus, setAiStatus] = useState(null);
  const [memories, setMemories] = useState([]);
  const [crashes,  setCrashes]  = useState([]);
  const [sessions, setSessions] = useState([]);
  const [memTotal, setMemTotal] = useState(0);
  const [dbLoading, setDbLoading] = useState(false);
  const endRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({behavior:'smooth'}); }, [messages]);
  useEffect(() => {
    if (cg.kerriganStatus) cg.kerriganStatus().then(s=>setAiStatus(s)).catch(()=>{});
  }, []);

  const loadDb = () => {
    setDbLoading(true);
    Promise.allSettled([
      cg.dbMemories ? cg.dbMemories(20, 0) : Promise.resolve({memories:[],total:0}),
      cg.dbCrashes  ? cg.dbCrashes(20)     : Promise.resolve({crashes:[]}),
      cg.dbSessions ? cg.dbSessions(10)    : Promise.resolve({sessions:[]}),
    ]).then(([m, c, s]) => {
      if (m.value) { setMemories(m.value.memories||[]); setMemTotal(m.value.total||0); }
      if (c.value) setCrashes(c.value.crashes||[]);
      if (s.value) setSessions(s.value.sessions||[]);
      setDbLoading(false);
    });
  };

  useEffect(() => { if (tab === 'memory' || tab === 'crashes' || tab === 'sessions') loadDb(); }, [tab]);

  const buildSystemContext = () => {
    const lines = ['[LIVE SYSTEM STATE — use this to answer questions about this specific machine]'];
    if (stats) {
      lines.push(`CPU: ${Math.round(stats.cpu)}% | RAM: ${stats.ramUsedGB}/${stats.ramTotalGB} GB | Net I/O: ${((stats.netInKB+stats.netOutKB)/1024).toFixed(1)} MB/s`);
    }
    if (threats && threats.length) {
      lines.push(`Active threats (${threats.length}):`);
      threats.slice(0,10).forEach(t => lines.push(`  - [${t.severity||'low'}] ${t.type} | ${t.detail||''} | src: ${t.source||'?'}`));
    } else {
      lines.push('Active threats: none detected');
    }
    if (secChecks && secChecks.length) {
      const failed = secChecks.filter(c=>c.status==='fail'||c.status==='warn');
      if (failed.length) {
        lines.push(`Security check warnings (${failed.length}):`);
        failed.forEach(c => lines.push(`  - [${c.status}] ${c.name}: ${c.detail||''}`));
      } else {
        lines.push('Security checks: all passing');
      }
    }
    if (ports && ports.length) {
      const open = ports.filter(p=>p.state==='LISTEN'||p.state==='listen');
      lines.push(`Open listening ports (${open.length}): ${open.slice(0,8).map(p=>`${p.port}/${p.process||'?'}`).join(', ')}`);
    }
    return lines.join('\n');
  };

  const send = async () => {
    const text = input.trim();
    if (!text || loading) return;
    setInput('');
    const next = [...messages, {role:'user',content:text}];
    setMessages(next);
    setLoading(true);
    try {
      const history = next.slice(-8).map(m=>({role:m.role,content:m.content}));
      const systemCtx = buildSystemContext();
      const r = await cg.kerriganChat(text, history, systemCtx);
      setMessages(p=>[...p,{role:'assistant',content:r.reply||r.error||'No response'}]);
    } catch(e) {
      setMessages(p=>[...p,{role:'assistant',content:`[Error: ${e.message}]`}]);
    } finally { setLoading(false); }
  };

  const tabs = [['chat','Chat'],['memory','Memories'],['crashes','Crashes'],['sessions','Sessions']];

  return (
    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col" style={{height:'calc(100vh - 180px)'}}>
      {/* Header */}
      <div className="p-4 border-b border-gray-100 flex items-center justify-between">
        <div className="flex items-center">
          <div className="w-9 h-9 bg-gradient-to-br from-purple-500 to-blue-600 rounded-xl flex items-center justify-center mr-3">
            <MessageSquare className="w-4 h-4 text-white"/>
          </div>
          <div>
            <h3 className="text-base font-bold text-gray-900">Kerrigan AI — {aiStatus?.model||'deepseek-coder:6.7b'}</h3>
            <p className="text-xs text-gray-500">{aiStatus?.online ? `Online · ${memTotal} memories in DB` : 'Connecting…'}</p>
          </div>
        </div>
        <div className={`flex items-center text-xs px-2 py-1 rounded-full ${aiStatus?.online?'bg-green-50 text-green-700':'bg-gray-100 text-gray-500'}`}>
          <div className={`w-1.5 h-1.5 rounded-full mr-1.5 ${aiStatus?.online?'bg-green-500':'bg-gray-400'}`}/>
          {aiStatus?.online ? 'Ready' : 'Offline'}
        </div>
      </div>

      {/* Tabs */}
      <div className="flex border-b border-gray-100 px-4">
        {tabs.map(([id,label])=>(
          <button key={id} onClick={()=>setTab(id)}
            className={`px-4 py-2.5 text-sm font-medium border-b-2 transition-colors mr-1 ${tab===id?'border-blue-600 text-blue-600':'border-transparent text-gray-500 hover:text-gray-700'}`}>
            {label}
          </button>
        ))}
      </div>

      {/* Chat tab */}
      {tab==='chat' && <>
        <div className="flex-1 overflow-y-auto p-5 space-y-4">
          {messages.map((m,i)=>(
            <div key={i} className={`flex ${m.role==='user'?'justify-end':'justify-start'}`}>
              <div className={`max-w-3xl px-4 py-3 rounded-2xl text-sm whitespace-pre-wrap break-words ${m.role==='user'?'bg-blue-600 text-white rounded-br-sm':'bg-gray-100 text-gray-800 rounded-bl-sm'}`}>
                {m.content}
              </div>
            </div>
          ))}
          {loading && <div className="flex justify-start"><div className="bg-gray-100 text-gray-500 px-4 py-3 rounded-2xl rounded-bl-sm text-sm animate-pulse">Thinking…</div></div>}
          <div ref={endRef}/>
        </div>
        <div className="p-4 border-t border-gray-100">
          <div className="flex gap-2">
            <input value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&(e.preventDefault(),send())}
              placeholder="Ask about vulnerabilities, malware, exploit techniques…"
              className="flex-1 px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            <button onClick={send} disabled={loading||!input.trim()}
              className="px-4 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 disabled:opacity-40 transition-colors">
              <Send className="w-4 h-4"/>
            </button>
          </div>
        </div>
      </>}

      {/* Memory tab */}
      {tab==='memory' && (
        <div className="flex-1 overflow-y-auto p-5">
          <div className="flex items-center justify-between mb-4">
            <span className="text-sm font-medium text-gray-700">{memTotal} total memories in kerrigan_db</span>
            <button onClick={loadDb} disabled={dbLoading} className="text-xs bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg hover:bg-blue-100 disabled:opacity-50">
              {dbLoading ? 'Loading…' : 'Refresh'}
            </button>
          </div>
          {memories.length === 0
            ? <div className="text-sm text-gray-400 text-center py-12">{dbLoading ? 'Loading…' : 'No memories yet'}</div>
            : memories.map((m,i)=>(
              <div key={m.id} className="border border-gray-100 rounded-xl p-4 mb-3 hover:bg-gray-50">
                <div className="flex items-start justify-between gap-2 mb-1">
                  <span className="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full font-medium">{m.expert||'general'}</span>
                  <span className="text-xs text-gray-400 flex-shrink-0">{m.created_at ? new Date(m.created_at).toLocaleString() : '—'}</span>
                </div>
                <p className="text-sm text-gray-800 mt-1">{m.content}</p>
                {m.tags && <p className="text-xs text-gray-400 mt-1">{m.tags}</p>}
              </div>
            ))
          }
        </div>
      )}

      {/* Crashes tab */}
      {tab==='crashes' && (
        <div className="flex-1 overflow-y-auto p-5">
          <div className="flex items-center justify-between mb-4">
            <span className="text-sm font-medium text-gray-700">Crash findings from kerrigan_db</span>
            <button onClick={loadDb} disabled={dbLoading} className="text-xs bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg hover:bg-blue-100 disabled:opacity-50">
              {dbLoading ? 'Loading…' : 'Refresh'}
            </button>
          </div>
          {crashes.length === 0
            ? <div className="text-sm text-gray-400 text-center py-12">{dbLoading ? 'Loading…' : 'No crashes logged'}</div>
            : crashes.map((c,i)=>(
              <div key={i} className={`border rounded-xl p-4 mb-3 ${c.exploitability==='high'?'border-red-200 bg-red-50':c.exploitability==='medium'?'border-yellow-200 bg-yellow-50':'border-gray-200'}`}>
                <div className="flex items-center justify-between mb-1">
                  <span className="font-medium text-sm text-gray-900">{c.crash_type||c.type||'Unknown crash'}</span>
                  <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${c.exploitability==='high'?'bg-red-200 text-red-800':c.exploitability==='medium'?'bg-yellow-200 text-yellow-800':'bg-gray-200 text-gray-700'}`}>
                    {c.exploitability||'unknown'} exploitability
                  </span>
                </div>
                {c.signal && <p className="text-xs text-gray-600">Signal: {c.signal}</p>}
                {c.created_at && <p className="text-xs text-gray-400 mt-1">{new Date(c.created_at).toLocaleString()}</p>}
              </div>
            ))
          }
        </div>
      )}

      {/* Sessions tab */}
      {tab==='sessions' && (
        <div className="flex-1 overflow-y-auto p-5">
          <div className="flex items-center justify-between mb-4">
            <span className="text-sm font-medium text-gray-700">Kerrigan training sessions</span>
            <button onClick={loadDb} disabled={dbLoading} className="text-xs bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg hover:bg-blue-100 disabled:opacity-50">
              {dbLoading ? 'Loading…' : 'Refresh'}
            </button>
          </div>
          {sessions.length === 0
            ? <div className="text-sm text-gray-400 text-center py-12">{dbLoading ? 'Loading…' : 'No sessions logged'}</div>
            : sessions.map((s,i)=>(
              <div key={i} className="border border-gray-200 rounded-xl p-4 mb-3">
                <div className="flex items-center justify-between mb-1">
                  <span className="font-medium text-sm text-gray-900">{s.session_id||`Session ${s.id}`}</span>
                  <span className="text-xs text-gray-400">{s.started_at ? new Date(s.started_at).toLocaleString() : '—'}</span>
                </div>
                <div className="grid grid-cols-3 gap-2 mt-2 text-xs text-gray-600">
                  {s.crashes_found != null && <span>Crashes: <strong>{s.crashes_found}</strong></span>}
                  {s.patches_generated != null && <span>Patches: <strong>{s.patches_generated}</strong></span>}
                  {s.status && <span>Status: <strong>{s.status}</strong></span>}
                </div>
              </div>
            ))
          }
        </div>
      )}
    </div>
  );
}

// ── Module config (all static class names so Tailwind JIT detects them) ───────
const MODULES = [
  {id:'dashboard',       label:'Dashboard',           Icon:Activity,      bg:'bg-blue-50',   txt:'text-blue-700',   bdr:'border-blue-200',   ico:'text-blue-600'  },
  {id:'ai-assistant',    label:'AI Assistant',         Icon:MessageSquare, bg:'bg-indigo-50', txt:'text-indigo-700', bdr:'border-indigo-200', ico:'text-indigo-600'},
  {id:'ai-patcher',      label:'AI Auto-Patcher',      Icon:Zap,           bg:'bg-cyan-50',   txt:'text-cyan-700',   bdr:'border-cyan-200',   ico:'text-cyan-600'  },
  {id:'packet-analyzer', label:'Packet Analysis',      Icon:Network,       bg:'bg-green-50',  txt:'text-green-700',  bdr:'border-green-200',  ico:'text-green-600' },
  {id:'vuln-scanner',    label:'Vuln Scanner',         Icon:Bug,           bg:'bg-red-50',    txt:'text-red-700',    bdr:'border-red-200',    ico:'text-red-600'   },
  {id:'pen-testing',     label:'Penetration Testing',  Icon:Target,        bg:'bg-purple-50', txt:'text-purple-700', bdr:'border-purple-200', ico:'text-purple-600'},
  {id:'crypto-audit',    label:'Crypto Audit',         Icon:Lock,          bg:'bg-yellow-50', txt:'text-yellow-700', bdr:'border-yellow-200', ico:'text-yellow-600'},
  {id:'ids-ips',         label:'IDS / IPS',            Icon:Shield,        bg:'bg-orange-50', txt:'text-orange-700', bdr:'border-orange-200', ico:'text-orange-600'},
  {id:'forensics',       label:'Forensics',            Icon:Search,        bg:'bg-pink-50',   txt:'text-pink-700',   bdr:'border-pink-200',   ico:'text-pink-600'  },
  {id:'network-map',     label:'Network Map',          Icon:MapIcon,       bg:'bg-teal-50',   txt:'text-teal-700',   bdr:'border-teal-200',   ico:'text-teal-600'  },
];

// ── Root App ──────────────────────────────────────────────────────────────────
function App() {
  const [active,    setActive]    = useState('dashboard');
  const [stats,     setStats]     = useState(null);
  const [threats,   setThreats]   = useState([]);
  const [conns,     setConns]     = useState([]);
  const [ports,     setPorts]     = useState([]);
  const [devices,   setDevices]   = useState([]);
  const [secChecks, setSecChecks] = useState([]);

  useEffect(() => {
    Promise.allSettled([
      cg.getSecurityChecks && cg.getSecurityChecks(),
      cg.getNetworkDevices && cg.getNetworkDevices(),
    ]).then(([c,d]) => {
      if (c.status==='fulfilled' && c.value) setSecChecks(c.value);
      if (d.status==='fulfilled' && d.value) setDevices(d.value);
    });

    if (cg.onStatsUpdate)       cg.onStatsUpdate(d => setStats(d));
    if (cg.onThreatDetected)    cg.onThreatDetected(t => setThreats(p => [t,...p].slice(0,50)));
    if (cg.onConnectionsUpdate) cg.onConnectionsUpdate(d => setConns(d||[]));
    if (cg.onPortsUpdate)       cg.onPortsUpdate(d => setPorts(d||[]));

    return () => ['stats-update','threat-detected','connections-update','ports-update'].forEach(ch => cg.off && cg.off(ch));
  }, []);

  const cpu = stats ? Math.round(stats.cpu) : 0;

  return (
    <div className="min-h-screen bg-gray-50">
      {/* Header */}
      <div className="bg-white shadow-sm border-b border-gray-200">
        <div className="max-w-screen-2xl mx-auto px-6 py-4 flex items-center justify-between">
          <div className="flex items-center">
            <div className="w-10 h-10 bg-gradient-to-br from-red-500 to-purple-600 rounded-2xl flex items-center justify-center mr-4">
              <Shield className="w-6 h-6 text-white"/>
            </div>
            <div>
              <h1 className="text-2xl font-bold text-gray-900">CyberGuard AI Enterprise</h1>
              <p className="text-sm text-gray-600">Advanced Security Operations Console</p>
            </div>
          </div>
          <div className="flex items-center space-x-4">
            <div className="flex items-center text-sm text-gray-600">
              <div className="w-2 h-2 bg-green-400 rounded-full mr-2 animate-pulse"></div>
              All Systems Operational
            </div>
            <button onClick={()=>setActive('ids-ips')} className="p-2 hover:bg-gray-100 rounded-full">
              <SettingsIcon className="w-5 h-5 text-gray-600"/>
            </button>
          </div>
        </div>
      </div>

      <div className="max-w-screen-2xl mx-auto px-6 py-6 flex gap-6">
        {/* Sidebar */}
        <div className="w-56 flex-shrink-0 bg-white rounded-2xl p-4 shadow-sm border border-gray-100 self-start sticky top-6">
          <nav className="space-y-1">
            {MODULES.map(({id,label,Icon,bg,txt,bdr,ico}) => {
              const on = active===id;
              return (
                <button key={id} onClick={()=>setActive(id)}
                  className={`w-full flex items-center p-3 rounded-xl text-left transition-colors ${on?`${bg} ${txt} border ${bdr}`:'hover:bg-gray-50 text-gray-700'}`}>
                  <Icon className={`w-4 h-4 mr-3 flex-shrink-0 ${on?ico:'text-gray-500'}`}/>
                  <span className="font-medium text-sm">{label}</span>
                </button>
              );
            })}
          </nav>
          <div className="mt-6 p-4 bg-gray-50 rounded-xl">
            <h4 className="font-semibold text-gray-900 text-sm mb-3">System Status</h4>
            <div className="space-y-2 text-xs">
              {[['CPU', `${cpu}%`],['Threats', String(threats.length)],['Connections', String(conns.length)],['RAM', stats?`${stats.ramUsedGB.toFixed(1)}GB`:'—']].map(([k,v],i)=>(
                <div key={i} className="flex justify-between"><span className="text-gray-600">{k}</span><span className="font-medium">{v}</span></div>
              ))}
            </div>
          </div>
        </div>

        {/* Main content */}
        <div className="flex-1 min-w-0">
          {active==='dashboard'       && <DashboardView stats={stats} threats={threats} secChecks={secChecks}/>}
          {active==='ai-assistant'    && <AIAssistantView stats={stats} threats={threats} secChecks={secChecks} ports={ports}/>}
          {active==='ai-patcher'      && <AIPatcherView/>}
          {active==='packet-analyzer' && <PacketAnalyzerView connections={conns}/>}
          {active==='vuln-scanner'    && <VulnScannerView secChecks={secChecks}/>}
          {active==='pen-testing'     && <PenTestingView/>}
          {active==='crypto-audit'    && <CryptoAuditView/>}
          {active==='ids-ips'         && <IDSIPSView threats={threats}/>}
          {active==='forensics'       && <ForensicsView/>}
          {active==='network-map'     && <NetworkMapView devices={devices} ports={ports}/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
