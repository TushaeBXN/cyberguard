name: Build & Release

# Triggers on version tags (e.g. v1.0.1) or manual dispatch
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: '*.dmg'
            script: dist:mac
          - os: windows-latest
            artifact: '*.exe'
            script: dist:win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build & publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberguard-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: warn
